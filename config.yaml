  exposure_gradient_not_mediation: The exposure regressions identify conditional associations within the coalition. They do not constitute a formal mediation analysis.
  # RETAINED: supplied revised specification.
  no_household_incidence_estimated: The paper does not estimate household or firm incidence of the price increase; only national aggregates.
