methodological_notes:
  # RETAINED: supplied revised specification.
  estimand_interpretation: The ATT is the equally weighted average counterfactual gap among the countries in the estimation target group. Countries receive equal weight regardless of population or economic size.
  # RETAINED: supplied revised specification.
  incremental_vs_level_estimand: Wave-2 level ATT is a total post-2022 gap vs non-participation. The preferred incremental contrast subtracts each country's 2019-2021 mean gap from its 2022-2024 mean gap.
  # RETAINED: supplied revised specification. Supplied annotation: REVISED — added.
  coefficient_ordering_property: The incremental post-2022 CPI effect (0.072) exceeds the Wave-2 level ATT (0.022) because the coalition entered 2022 from a negative Wave-1 position. The incremental captures the upward trajectory from that starting point; the level ATT measures final standing relative to the zero-deviation baseline.
  # RETAINED: supplied revised specification.
  stable_gap_assumption_content: Inherited baseline (2019-2021) can be nonzero; no further post-2021 drift in that inherited baseline or in the mean counterfactual prediction error.
  # RETAINED: supplied revised specification.
  causal_interpretation_conditions:
    - Donor factor captures common shocks relevant to coalition members
    - Pre-2014 relationships remain informative after 2013
    - Timing, anticipation, and spillover conditions hold
  three_interface_invariants:
    - No target-country post-2013 realization enters its own counterfactual
    - No treatment information enters eligibility or imputation rules
    - Robustness branches never replace the baseline estimate
  log_point_percentage_convention: Exact percentage = 100*(exp(theta_hat)-1); small-effect approximation = 100*theta_hat.
  # RETAINED: supplied revised specification.
  stars_source_rule: Main-table significance stars come from the country-dispersion SE. Bootstrap and placebo outputs are complementary diagnostics only.
  # RETAINED: supplied revised specification.
  cost_bundle_interpretation: Estimates capture realized path of coalition members under the 2022 bundle (legal sanctions + supply cuts + reallocation + compensation), not the ceteris-paribus effect of any single legal instrument.
  # RETAINED: supplied revised specification.
  not_a_success_or_failure_verdict: Evidence of sender costs does not establish that sanctions failed or reduced welfare. Full assessment would require evidence on costs to Russia and strategic benefits of coalition participation, neither of which is estimated.
